# L-shape shift training schedule
# Progressive shift ratio increase

schedule_type: step_up_extreme
description: "L-shape annealing: warmup -> transition -> main -> extreme -> pure"

total_epochs: 120

stages:
  - name: "warmup"
    start_epoch: 0
    end_epoch: 14
    shift_ratio: 0.3
    shift_weight: 0.5
    shift_mask_weight: 0.2
    description: "warmup phase: 30% shift"

  - name: "transition"
    start_epoch: 15
    end_epoch: 29
    shift_ratio: 0.5
    shift_weight: 0.8
    shift_mask_weight: 0.2
    description: "transition phase: 50% shift"

  - name: "main_battle"
    start_epoch: 30
    end_epoch: 99
    shift_ratio: 0.7
    shift_weight: 1.0
    shift_mask_weight: 0.2
    description: "main phase: 70% shift"

  - name: "extreme_pressure"
    start_epoch: 100
    end_epoch: 109
    shift_ratio: 0.9
    shift_weight: 1.0
    shift_mask_weight: 0.2
    description: "extreme phase: 90% shift"

  - name: "pure_finetuning"
    start_epoch: 110
    end_epoch: 119
    shift_ratio: 0.0
    shift_weight: 0.1
    shift_mask_weight: 0.0
    description: "pure finetuning: 0% shift"