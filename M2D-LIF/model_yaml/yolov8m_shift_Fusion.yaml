# YOLOv8 with Cross-Modal Shift Prediction + Learnable Fusion
# 使用 FusionAdd 替代简单的 Add，实现可学习的特征融合
# - 解决两个独立训练的 backbone 特征分布不一致的问题
# - FusionAdd 会对两个模态的特征分别做 1x1 卷积对齐后再相加
# - 只在 P3/P4/P5 融合（P2 不参与检测，无需融合）

ch: 6
nc: 3  # FLIR

scales:  # model compound scaling constants
  # [depth, width, max_channels]
  n: [ 0.33, 0.25, 1024 ]
  s: [ 0.33, 0.50, 1024 ]
  m: [ 0.67, 0.75, 768 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.25, 512 ]

backbone:
  # 输入处理
  - [ -1, 1, IN, [ ] ]                      # 0 - 输入分离
  - [ -1, 1, Multiin, [ 1 ] ]               # 1 - RGB 输入
  - [ -2, 1, Multiin, [ 2 ] ]               # 2 - IR 输入

  # P1/2 - 双分支
  - [ -2, 1, Conv, [ 64, 3, 2 ] ]           # 3 - RGB Conv P1
  - [ -2, 1, Conv, [ 64, 3, 2 ] ]           # 4 - IR Conv P1

  # P2/4 - 双分支 (不融合，保持独立)
  - [ -2, 1, Conv, [ 128, 3, 2 ] ]          # 5 - RGB Conv P2
  - [ -2, 1, Conv, [ 128, 3, 2 ] ]          # 6 - IR Conv P2
  - [ -2, 3, C2f, [ 128, True ] ]           # 7 - RGB C2f P2
  - [ -2, 3, C2f, [ 128, True ] ]           # 8 - IR C2f P2
  - [ [ -1, -2 ], 1, Add, [ ] ]             # 9 - 融合 P2 (简单相加，不参与检测)

  # P3/8 - 双分支 (保存独立特征给 ShiftHead)
  - [ -3, 1, Conv, [ 256, 3, 2 ] ]          # 10 - RGB Conv P3
  - [ -3, 1, Conv, [ 256, 3, 2 ] ]          # 11 - IR Conv P3
  - [ -2, 6, C2f, [ 256, True ] ]           # 12 - RGB C2f P3 ★
  - [ -2, 6, C2f, [ 256, True ] ]           # 13 - IR C2f P3 ★
  - [ [ -1, -2 ], 1, FusionAdd, [ ] ]       # 14 - 可学习融合 P3 (用于检测)

  # P4/16 - 双分支 (保存独立特征给 ShiftHead)
  - [ -3, 1, Conv, [ 512, 3, 2 ] ]          # 15 - RGB Conv P4
  - [ -3, 1, Conv, [ 512, 3, 2 ] ]          # 16 - IR Conv P4
  - [ -2, 6, C2f, [ 512, True ] ]           # 17 - RGB C2f P4 ★
  - [ -2, 6, C2f, [ 512, True ] ]           # 18 - IR C2f P4 ★
  - [ [ -1, -2 ], 1, FusionAdd, [ ] ]       # 19 - 可学习融合 P4 (用于检测)

  # P5/32 - 双分支 (保存独立特征给 ShiftHead)
  - [ -3, 1, Conv, [ 1024, 3, 2 ] ]         # 20 - RGB Conv P5
  - [ -3, 1, Conv, [ 1024, 3, 2 ] ]         # 21 - IR Conv P5
  - [ -2, 3, C2f, [ 1024, True ] ]          # 22 - RGB C2f P5 ★
  - [ -2, 3, C2f, [ 1024, True ] ]          # 23 - IR C2f P5 ★
  - [ [ -1, -2 ], 1, FusionAdd, [ ] ]       # 24 - 可学习融合 P5 (用于检测)

  - [ -1, 1, SPPF, [ 512, 5 ] ]             # 25 - SPPF

head:
  # ========== 检测分支 (使用融合特征) ==========
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ [ -1, 19 ], 1, Concat, [ 1 ] ]        # 27 - cat P4
  - [ -1, 3, C2f, [ 512 ] ]                 # 28

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ [ -1, 14 ], 1, Concat, [ 1 ] ]        # 30 - cat P3
  - [ -1, 3, C2f, [ 256 ] ]                 # 31 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]
  - [ [ -1, 28 ], 1, Concat, [ 1 ] ]        # 33 - cat head P4
  - [ -1, 3, C2f, [ 512 ] ]                 # 34 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 25 ], 1, Concat, [ 1 ] ]        # 36 - cat head P5
  - [ -1, 3, C2f, [ 1024 ] ]                # 37 (P5/32-large)

  # 检测头 (只接收融合特征)
  - [ [ 31, 34, 37 ], 1, Detect, [ nc ] ]   # 38 - 检测头

  # ========== Shift 分支 (使用独立 RGB/IR 特征) ==========
  # 输入: [RGB_P3, IR_P3, RGB_P4, IR_P4, RGB_P5, IR_P5]
  # ★ 层 12, 13, 17, 18, 22, 23 是独立的 RGB/IR 特征
  - [ [ 12, 13, 17, 18, 22, 23 ], 1, ShiftHead, [ ] ]  # 39 - Shift 头