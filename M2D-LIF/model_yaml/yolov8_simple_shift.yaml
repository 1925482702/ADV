# YOLOv8 Simple Shift Model - 使用简化版 ShiftHead（无注意力机制）
# 用于快速对比实验，计算量显著低于 yolov8_shift.yaml

ch: 6
nc: 3 # FLIR
scales: # model compound scaling constants
  n: [ 0.33, 0.25, 1024 ]
  s: [ 0.33, 0.50, 1024 ]
  m: [ 0.67, 0.75, 768 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.25, 512 ]

backbone:
  - [ -1, 1, IN, [ ] ]  # 0
  - [ -1, 1, Multiin, [ 1 ] ]  # 1
  - [ -2, 1, Multiin, [ 2 ] ]  # 2

  - [ -2, 1, Conv, [ 64, 3, 2 ] ]  # 3-P1/2
  - [ -2, 1, Conv, [ 64, 3, 2 ] ]

  - [ -2, 1, Conv, [ 128, 3, 2 ] ]  # 5-P2/4
  - [ -2, 1, Conv, [ 128, 3, 2 ] ]

  - [ -2, 3, C2f, [ 128, True ] ]  # 7
  - [ -2, 3, C2f, [ 128, True ] ]

  - [ -2, 1, Conv, [ 256, 3, 2 ] ]  # 9-P3/8
  - [ -2, 1, Conv, [ 256, 3, 2 ] ]

  - [ -2, 6, C2f, [ 256, True ] ]  # 11
  - [ -2, 6, C2f, [ 256, True ] ]

  - [ [ -1, -2 ], 1, Add, [ ] ]  # 13

  - [ -3, 1, Conv, [ 512, 3, 2 ] ]  # 14-P4/16
  - [ -3, 1, Conv, [ 512, 3, 2 ] ]

  - [ -2, 6, C2f, [ 512, True ] ]  # 16
  - [ -2, 6, C2f, [ 512, True ] ]

  - [ [ -1, -2 ], 1, Add, [ ] ]  # 18

  - [ -3, 1, Conv, [ 1024, 3, 2 ] ]  # 19-P5/32
  - [ -3, 1, Conv, [ 1024, 3, 2 ] ]

  - [ -2, 3, C2f, [ 1024, True ] ] # 21
  - [ -2, 3, C2f, [ 1024, True ] ]

  - [ [ -1, -2 ], 1, Add, [ ] ] # 23

  - [ -1, 1, SPPF, [ 512, 5 ] ] # 24

head:
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ [ -1, 18 ], 1, Concat, [ 1 ] ]
  - [ -1, 3, C2f, [ 512 ] ]  # 27

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]
  - [ [ -1, 13 ], 1, Concat, [ 1 ] ]
  - [ -1, 3, C2f, [ 256 ] ]  # 30 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]
  - [ [ -1, 27 ], 1, Concat, [ 1 ] ]
  - [ -1, 3, C2f, [ 512 ] ]  # 33 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]
  - [ [ -1, 24 ], 1, Concat, [ 1 ] ]
  - [ -1, 3, C2f, [ 1024 ] ]  # 36 (P5/32-large)

  # Detect 检测头
  - [ [ 30, 33, 36 ], 1, Detect, [ nc ] ]   # 37

  # SimpleShiftHead: 简化版 Shift 预测头（无注意力，纯卷积）
  - [ [ 37, 11, 12, 16, 17, 21, 22 ], 1, SimpleShiftHead, [] ]  # 38
