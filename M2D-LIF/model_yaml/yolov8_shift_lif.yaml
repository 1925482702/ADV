# YOLOv8 with LIF Fusion + Shift Prediction (Dual-Path Architecture)
# 
# 输入: 9 通道 [RGB_clean, IR_clean, Shifted_Part]
# - RGB_clean: 干净的 RGB 图像
# - IR_clean: 干净的 IR 图像  
# - Shifted_Part: 被平移后的模态（可能是 RGB_shifted 或 IR_shifted）
#
# 模型内部:
# - Clean Path: [RGB_clean, IR_clean] → LIF 融合 → 检测
# - Shift Path: 根据 shift_modality 组合 → 独立特征 → Shift 预测
#
# 关键层号:
# - LIF 模块: 层 2 (生成权重图)
# - RGB C2f P3/P4/P5: 层 12, 17, 22
# - IR C2f P3/P4/P5: 层 13, 18, 23
# - LIFAdd P3/P4/P5: 层 14, 19, 24
# - Detect 头: 层 38
# - ShiftHead: 层 39

ch: 6  # 模型内部处理 6 通道（ShiftLIFModel.forward 会将 9 通道输入转换为 2B 个 6 通道）
nc: 3  # FLIR

scales:
  n: [ 0.33, 0.25, 1024 ]
  s: [ 0.33, 0.50, 1024 ]
  m: [ 0.67, 0.75, 768 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.25, 512 ]

backbone:
  # 输入分离
  - [ -1, 1, IN, [ ] ]                    # 0 - 输入分离器
  - [ -1, 1, Multiin, [ 1 ] ]             # 1 - RGB 输入
  - [ -1, 1, LIF, [] ]                    # 2 - LIF 权重图 (用于 LIFAdd)
  - [ -3, 1, Multiin, [ 2 ] ]             # 3 - IR 输入

  # P1/2 - 双分支
  - [ -3, 1, Conv, [ 64, 3, 2 ] ]         # 4 - RGB Conv P1/2
  - [ -2, 1, Conv, [ 64, 3, 2 ] ]         # 5 - IR Conv P1/2

  # P2/4 - 双分支
  - [ -2, 1, Conv, [ 128, 3, 2 ] ]        # 6 - RGB Conv P2/4
  - [ -2, 1, Conv, [ 128, 3, 2 ] ]        # 7 - IR Conv P2/4
  - [ -2, 3, C2f, [ 128, True ] ]         # 8 - RGB C2f P2
  - [ -2, 3, C2f, [ 128, True ] ]         # 9 - IR C2f P2

  # P3/8 - 双分支 (保存独立特征给 ShiftHead)
  - [ -2, 1, Conv, [ 256, 3, 2 ] ]        # 10 - RGB Conv P3/8
  - [ -2, 1, Conv, [ 256, 3, 2 ] ]        # 11 - IR Conv P3/8
  - [ -2, 6, C2f, [ 256, True ] ]         # 12 - RGB C2f P3 ★ (独立特征)
  - [ -2, 6, C2f, [ 256, True ] ]         # 13 - IR C2f P3 ★ (独立特征)
  - [ [ -1, -2, 2 ], 1, LIFAdd, [ 3 ] ]   # 14 - LIF 融合 P3

  # P4/16 - 双分支 (保存独立特征给 ShiftHead)
  - [ -3, 1, Conv, [ 512, 3, 2 ] ]        # 15 - RGB Conv P4/16
  - [ -2, 1, Conv, [ 512, 3, 2 ] ]        # 16 - IR Conv P4/16
  - [ -2, 6, C2f, [ 512, True ] ]         # 17 - RGB C2f P4 ★ (独立特征)
  - [ -2, 6, C2f, [ 512, True ] ]         # 18 - IR C2f P4 ★ (独立特征)
  - [ [ -1, -2, 2 ], 1, LIFAdd, [ 4 ] ]   # 19 - LIF 融合 P4

  # P5/32 - 双分支 (保存独立特征给 ShiftHead)
  - [ -3, 1, Conv, [ 1024, 3, 2 ] ]       # 20 - RGB Conv P5/32
  - [ -2, 1, Conv, [ 1024, 3, 2 ] ]       # 21 - IR Conv P5/32
  - [ -2, 3, C2f, [ 1024, True ] ]        # 22 - RGB C2f P5 ★ (独立特征)
  - [ -2, 3, C2f, [ 1024, True ] ]        # 23 - IR C2f P5 ★ (独立特征)
  - [ [ -1, -2, 2 ], 1, LIFAdd, [ 5 ] ]   # 24 - LIF 融合 P5

  - [ -1, 1, SPPF, [ 512, 5 ] ]           # 25 - SPPF

head:
  # ========== 检测分支 (使用 LIF 融合特征) ==========
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]  # 26
  - [ [ -1, 19 ], 1, Concat, [ 1 ] ]      # 27 - cat backbone P4
  - [ -1, 3, C2f, [ 512 ] ]               # 28

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ]  # 29
  - [ [ -1, 14 ], 1, Concat, [ 1 ] ]      # 30 - cat backbone P3
  - [ -1, 3, C2f, [ 256 ] ]               # 31 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]        # 32
  - [ [ -1, 28 ], 1, Concat, [ 1 ] ]      # 33 - cat head P4
  - [ -1, 3, C2f, [ 512 ] ]               # 34 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]        # 35
  - [ [ -1, 25 ], 1, Concat, [ 1 ] ]      # 36 - cat head P5
  - [ -1, 3, C2f, [ 1024 ] ]              # 37 (P5/32-large)

  # 检测头 (只接收融合特征)
  - [ [ 31, 34, 37 ], 1, Detect, [ nc ] ] # 38 - 检测头

  # ========== Shift 分支 (使用独立 RGB/IR 特征) ==========
  # 输入: [RGB_P3, IR_P3, RGB_P4, IR_P4, RGB_P5, IR_P5]
  # ★ 层 12, 13, 17, 18, 22, 23 是独立的 RGB/IR 特征
  - [ [ 12, 13, 17, 18, 22, 23 ], 1, ShiftHead, [ ] ]  # 39 - Shift 头
